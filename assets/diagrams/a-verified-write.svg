<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1328 338" width="1328" height="338" role="img" aria-label="What happens around every write" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2a3d"/></marker></defs>
<rect width="1328" height="338" fill="#ffffff"/>
<text x="28" y="34" font-size="18" font-weight="600" fill="#1f2a3d">What happens around every write</text>
<line x1="243" y1="123" x2="315" y2="123" stroke="#1f2a3d" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="243.3" y="102" width="71.4" height="18" rx="4" fill="#ffffff"/>
<text x="279" y="115" font-size="12" text-anchor="middle" fill="#56627a">all clear</text>
<line x1="499" y1="123" x2="571" y2="123" stroke="#1f2a3d" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="755" y1="123" x2="827" y2="123" stroke="#1f2a3d" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="1011" y1="123" x2="1083" y2="123" stroke="#1f2a3d" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="1024.5" y="102" width="45" height="18" rx="4" fill="#ffffff"/>
<text x="1047" y="115" font-size="12" text-anchor="middle" fill="#56627a">match</text>
<line x1="152" y1="162" x2="152" y2="212" stroke="#1f2a3d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#head)"/>
<rect x="103.1" y="178" width="97.8" height="18" rx="4" fill="#ffffff"/>
<text x="152" y="191" font-size="12" text-anchor="middle" fill="#56627a">a check fails</text>
<line x1="920" y1="162" x2="920" y2="212" stroke="#1f2a3d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#head)"/>
<rect x="887.6" y="178" width="64.8" height="18" rx="4" fill="#ffffff"/>
<text x="920" y="191" font-size="12" text-anchor="middle" fill="#56627a">no match</text>
<rect x="64" y="87" width="176" height="72" rx="9" fill="#f1f4f9" stroke="#1f2a3d" stroke-width="1.5"/>
<text x="152" y="119" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2a3d">Check first</text>
<text x="152" y="138" font-size="11.5" text-anchor="middle" fill="#56627a">collection, canvas, outputs</text>
<rect x="320" y="87" width="176" height="72" rx="9" fill="#f1f4f9" stroke="#1f2a3d" stroke-width="1.5"/>
<text x="408" y="119" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2a3d">Write</text>
<text x="408" y="138" font-size="11.5" text-anchor="middle" fill="#56627a">one change at a time</text>
<rect x="576" y="87" width="176" height="72" rx="9" fill="#f1f4f9" stroke="#1f2a3d" stroke-width="1.5"/>
<text x="664" y="119" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2a3d">Read back</text>
<text x="664" y="138" font-size="11.5" text-anchor="middle" fill="#56627a">ask OBS what it holds</text>
<rect x="832" y="87" width="176" height="72" rx="9" fill="#f1f4f9" stroke="#1f2a3d" stroke-width="1.5"/>
<text x="920" y="119" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2a3d">Compare</text>
<text x="920" y="138" font-size="11.5" text-anchor="middle" fill="#56627a">every field that was set</text>
<rect x="1088" y="87" width="176" height="72" rx="9" fill="#2f4b7c" stroke="#2f4b7c" stroke-width="1.5"/>
<text x="1176" y="119" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">Done</text>
<text x="1176" y="138" font-size="11.5" text-anchor="middle" fill="#dbe4f3">reported to Terraform</text>
<rect x="64" y="217" width="176" height="72" rx="9" fill="#ffffff" stroke="#1f2a3d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="152" y="249" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2a3d">Refuse</text>
<text x="152" y="268" font-size="11.5" text-anchor="middle" fill="#56627a">nothing was written</text>
<rect x="832" y="217" width="176" height="72" rx="9" fill="#ffffff" stroke="#1f2a3d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="920" y="249" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2a3d">Fail and taint</text>
<text x="920" y="268" font-size="11.5" text-anchor="middle" fill="#56627a">next plan shows the truth</text>
</svg>
